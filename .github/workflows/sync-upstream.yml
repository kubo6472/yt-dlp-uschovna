name: Sync upstream

on:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false  # never interrupt a merge/push mid-run

env:
  UPSTREAM_REPO: yt-dlp/yt-dlp

jobs:
  sync:
    name: Sync
    permissions:
      contents: write  # Push the upstream merge commit to master
      actions: write   # Dispatch release.yml via gh workflow run
    runs-on: ubuntu-latest
    steps:
      # SYNC_TOKEN (PAT with repo+workflow) is required once upstream edits
      # .github/workflows/: GITHUB_TOKEN pushes containing workflow changes
      # are rejected. The fallback keeps the job working until that happens.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          ref: master  # Always sync from master, even when dispatched on a branch
          fetch-depth: 0
          persist-credentials: true  # Needed to git-push the merge commit

      - name: Get latest upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api "repos/${UPSTREAM_REPO}/releases/latest" -q .tag_name)
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "Latest upstream release: ${TAG}"

      - name: Fetch and merge upstream tag
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "+refs/tags/${TAG}:refs/tags/${TAG}"
          if git merge-base --is-ancestor "${TAG}" HEAD; then
            echo "${TAG} is already merged"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-edit "${TAG}"
            git push origin HEAD:master
          fi

      - name: Dispatch release if missing
        env:
          TAG: ${{ steps.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Merge state and release state are independent: a failed dispatch or
          # failed release.yml run must be retried on the next sync.
          if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" -q '.[] | select(.draft == false) | .tag_name' | grep -q "^${TAG}\."; then
            echo "A release for ${TAG} already exists, nothing to do"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=10" \
              -q '.workflow_runs[] | select(.status == "in_progress" or .status == "queued") | .id' | grep -q .; then
            echo "A release run is already in progress, skipping"
            exit 0
          fi
          REV=1
          while git ls-remote --exit-code --tags origin "refs/tags/${TAG}.${REV}" >/dev/null 2>&1; do
            REV=$((REV + 1))
          done
          gh workflow run release.yml -R "${GITHUB_REPOSITORY}" -f "version=${TAG}.${REV}"
          echo "Released ${TAG}.${REV}"
